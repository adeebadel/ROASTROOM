<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROASTROOM · Post your problem. Let the internet make it worse.</title>
<meta name="description" content="ROASTROOM is an anonymous entertainment platform. Post your problem. Let the internet make it worse.">
<meta name="theme-color" content="#09090b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff4d2e'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='800' text-anchor='middle' fill='white' font-family='sans-serif'%3ER%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#09090b; --bg-2:#0d0d10; --surface:#121215; --surface-2:#18181c; --surface-3:#202026;
  --line:#26262c; --line-2:#34343c;
  --text:#f2f2f5; --muted:#9b9ba6; --dim:#6c6c77;
  --accent:#ff4d2e; --accent-2:#ff9a3d; --grad:linear-gradient(135deg,#ff4d2e 0%,#ff8a3d 100%);
  --good:#3ddc97; --bad:#ff5d6c; --info:#7aa8ff;
  --r:12px; --r-sm:8px; --nav-h:62px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--font);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 420px at 18% -8%,rgba(255,77,46,.11),transparent 62%),radial-gradient(700px 380px at 100% 0,rgba(122,168,255,.05),transparent 60%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
h1,h2,h3{line-height:1.2;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.center{text-align:center}
.fine{color:var(--dim);font-size:12.5px}
.ml-auto{margin-left:auto}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;border:2px solid var(--bg)}

/* ---------- layout ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px minmax(0,1fr) 320px;max-width:1280px;margin:0 auto;gap:0}
.side-left{position:sticky;top:0;height:100vh;padding:22px 14px 18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.side-right{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.center-col{min-width:0}
main{padding:18px 20px 120px;max-width:720px;margin:0 auto}
@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.side-right{display:none}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side-left{display:none}main{padding:14px 14px calc(var(--nav-h) + 96px)}}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;box-shadow:0 8px 26px -8px rgba(255,77,46,.7)}
.wordmark{font-weight:900;letter-spacing:.14em;font-size:15px}
.wordmark b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;position:relative;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface);color:var(--text)}
.nav a.active{background:var(--surface-2);color:var(--text)}
.nav a.active::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
.side-left .btn.block{margin:14px 4px 0}
.me-chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;text-align:left;transition:border-color .15s}
.me-chip:hover{border-color:var(--line-2)}
.me-chip .nm{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-chip .sub{font-size:11.5px;color:var(--dim)}
.me-chip>div{min-width:0;flex:1}

.bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(12,12,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);grid-template-columns:repeat(6,1fr)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:10.5px;font-weight:700;min-width:0}
.bottom-nav a.active{color:var(--text)}
.bottom-nav a.active .ic{color:var(--accent)}
.fab{display:none;position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:41;width:54px;height:54px;border-radius:16px;background:var(--grad);color:#fff;place-items:center;box-shadow:0 12px 30px -8px rgba(255,77,46,.75);transition:transform .15s}
.fab:active{transform:scale(.94)}.fab .ic{width:24px;height:24px}
@media (max-width:860px){.bottom-nav{display:grid}.fab{display:grid}}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 20px;background:rgba(9,9,11,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .brand{padding:0;display:none}
.search{position:relative;flex:1;max-width:520px;margin:0 auto}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim);width:16px;height:16px}
.search input{width:100%;height:40px;padding:0 44px 0 38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,77,46,.15)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px var(--mono);color:var(--dim);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px}
.top-avatar{display:none}
@media (max-width:860px){.topbar{padding:10px 14px}.topbar .brand{display:flex}.topbar .logo{width:30px;height:30px;font-size:16px}.topbar .wordmark{display:none}.top-avatar{display:block}.search kbd{display:none}.search{margin:0}}

/* ---------- primitives ---------- */
.card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:var(--r)}
.eyebrow{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:10px;font-weight:700;background:var(--grad);color:#fff;
  box-shadow:0 8px 24px -10px rgba(255,77,46,.8);transition:transform .12s,box-shadow .2s,filter .2s,opacity .2s;white-space:nowrap}
.btn:hover{filter:brightness(1.08);box-shadow:0 10px 28px -8px rgba(255,77,46,.9)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);box-shadow:none}
.btn.ghost:hover{background:var(--surface-3);filter:none}
.btn.danger{background:rgba(255,93,108,.12);border:1px solid rgba(255,93,108,.4);color:var(--bad);box-shadow:none}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled],.btn.loading{opacity:.55;pointer-events:none}
.btn.loading::after{content:"";width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted);border:1px solid var(--line);background:var(--surface);transition:color .15s,border-color .15s,background .15s}
.icon-btn:hover{color:var(--text);border-color:var(--line-2);background:var(--surface-2)}
.icon-btn.spin .ic{animation:spin .8s linear infinite}
.input,.textarea{width:100%;padding:11px 13px;border-radius:10px;background:var(--bg);border:1px solid var(--line-2);outline:none;transition:border-color .15s,box-shadow .15s}
.textarea{resize:vertical;min-height:110px;line-height:1.5}
.input:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,77,46,.15)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.field>.lbl{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.counter{font:600 11.5px var(--mono);color:var(--dim)}.counter.warn{color:var(--accent-2)}.counter.over{color:var(--bad)}
.avatar{--h:20;flex:none;width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;font-weight:800;font-size:13px;color:#fff;
  background:linear-gradient(135deg,hsl(var(--h) 70% 52%),hsl(calc(var(--h) + 40) 70% 38%))}
.avatar.lg{width:72px;height:72px;border-radius:20px;font-size:30px}.avatar.md{width:40px;height:40px;font-size:16px;border-radius:11px}
.pill,.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted)}
.tag{margin-left:auto}
.you{font:700 10px var(--mono);letter-spacing:.08em;color:var(--accent-2);border:1px solid rgba(255,154,61,.4);border-radius:5px;padding:0 5px;margin-left:6px}

/* ---------- hero / compose / toolbar ---------- */
.hero{padding:6px 2px 16px}
.hero h1{font-size:clamp(26px,5vw,38px);font-weight:900;letter-spacing:-.03em}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin-top:6px}
.compose{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.compose:hover{border-color:var(--line-2);transform:translateY(-1px)}
.compose .fake{flex:1;color:var(--dim);padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:auto;scrollbar-width:none}
.tabs button{padding:7px 14px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{color:var(--text)}.tabs button.on{background:var(--surface-3);color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all .15s}
.chip:hover{color:var(--text);border-color:var(--dim)}
.chip.on,.chip:has(input:checked){background:rgba(255,77,46,.13);border-color:rgba(255,77,46,.55);color:#ffb199}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:focus-visible){outline:2px solid var(--accent-2);outline-offset:2px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.page-head h1{font-size:26px;font-weight:900;letter-spacing:-.02em}
.page-head p{color:var(--muted);font-size:14px;margin-top:2px}

/* ---------- posts ---------- */
.post{padding:16px 18px;margin-bottom:12px;transition:border-color .18s,transform .18s,box-shadow .18s;animation:rise .35s both}
.post:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:0 14px 34px -22px #000}
.post-head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);flex-wrap:wrap;margin-bottom:10px}
.post-head .user{display:inline-flex;align-items:center;gap:8px;color:var(--text);font-weight:700;max-width:100%}
.post-head .user:hover span{text-decoration:underline}
.post-head .user span{overflow:hidden;text-overflow:ellipsis;max-width:180px;white-space:nowrap}
.post-main{cursor:pointer;display:block}
.post-main h3{font-size:18px;font-weight:800;margin-bottom:6px;overflow-wrap:anywhere}
.post-body{color:#d4d4da;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.post-actions{display:flex;align-items:center;gap:4px;margin:12px -6px -6px}
.act{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:9px;color:var(--muted);font-weight:700;font-size:13.5px;transition:background .15s,color .15s}
.act:hover{background:var(--surface-2);color:var(--text)}
.act.like.on{color:var(--accent)}.act.like.on .ic{fill:var(--accent)}
.act.pop .ic{animation:pop .4s}
.rank{font:800 13px var(--mono);color:var(--dim);min-width:30px}.rank.top{color:var(--accent-2)}
.score{font:700 11.5px var(--mono);color:var(--accent-2)}
@media (max-width:520px){.act .lbl{display:none}.post{padding:14px}}

/* ---------- battles ---------- */
.battle{padding:18px;margin-bottom:14px;animation:rise .35s both}
.battle h3{font-size:19px;font-weight:800;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;padding:14px;border-radius:11px;border:1px solid var(--line-2);background:var(--bg);text-align:left;overflow:hidden;transition:border-color .15s,transform .12s;width:100%}
.opt .fill{position:absolute;inset:0 auto 0 0;width:var(--w);background:linear-gradient(90deg,rgba(255,77,46,.20),rgba(255,154,61,.10));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.opt>*:not(.fill){position:relative}
.opt:not([disabled]):hover{border-color:var(--accent);transform:translateY(-1px)}
.opt[disabled]{cursor:default}
.opt .ab{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:800 13px var(--mono);background:var(--surface-3);flex:none}
.opt.mine{border-color:rgba(255,77,46,.7)}.opt.mine .ab{background:var(--grad);color:#fff}
.opt .txt{flex:1;font-weight:600;overflow-wrap:anywhere}
.opt .res{text-align:right;font:700 13px var(--mono)}.opt .res small{display:block;color:var(--dim);font-weight:600;font-size:11px}
.opt.lead .res b{color:var(--accent-2)}
.battle-foot{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crown{color:var(--accent-2);font-weight:800}

/* ---------- challenge ---------- */
.challenge-hero{padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.challenge-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,77,46,.22),transparent 70%);pointer-events:none}
.ch-prompt{font-size:clamp(22px,4.6vw,30px);font-weight:900;letter-spacing:-.02em;margin:10px 0 18px;position:relative}
.cd{font-family:var(--mono);color:var(--text)}
.answer{padding:14px 16px;margin-bottom:10px;animation:rise .3s both}
.answer .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin-bottom:6px}
.answer .who button{color:var(--text);font-weight:700}
.answer p{font-size:16px;overflow-wrap:anywhere}
.answer.mine{border-color:rgba(255,77,46,.5)}

/* ---------- leaderboard / profile ---------- */
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:12px;align-items:end;margin-bottom:18px}
.pod{padding:18px 12px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s;min-width:0;animation:rise .4s both}
.pod:hover{transform:translateY(-3px);border-color:var(--line-2)}
.pod .n{font:900 28px var(--mono);margin-bottom:8px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pod.p1{order:2;padding-top:26px;padding-bottom:26px;border-color:rgba(255,154,61,.5);box-shadow:0 18px 44px -26px rgba(255,120,50,.9)}
.pod.p2{order:1}.pod.p3{order:3}
.pod .nm{font-weight:800;margin:8px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pts{font:700 13px var(--mono);color:var(--accent-2)}
.pod .mini{font-size:11.5px;color:var(--dim);margin-top:4px}
@media (max-width:560px){.podium{grid-template-columns:1fr}.pod.p1,.pod.p2,.pod.p3{order:0;padding:14px;display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;text-align:left}.pod .n{margin:0;font-size:22px}.pod .nm{margin:0}.pod .mini{display:none}}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;animation:rise .3s both}
.lrow:hover{border-color:var(--line-2)}.lrow.me{border-color:rgba(255,77,46,.5)}
.lrow .pos{font:800 14px var(--mono);color:var(--dim);width:34px}
.lrow .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .st{font-size:12px;color:var(--dim)}
.lrow .pts{font:800 14px var(--mono);color:var(--accent-2)}
@media (max-width:520px){.lrow .st{display:none}}
.profile-head{display:flex;gap:18px;align-items:center;padding:20px;margin-bottom:14px;flex-wrap:wrap}
.profile-head .info{flex:1;min-width:200px}
.profile-head h1{font-size:24px;font-weight:900;overflow-wrap:anywhere}
.profile-head .meta{color:var(--muted);font-size:13.5px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.bigscore{text-align:right}.bigscore b{display:block;font:900 34px var(--mono);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.stat{padding:12px 8px;text-align:center}.stat b{display:block;font:800 20px var(--mono)}.stat span{font-size:11.5px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
@media (max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}}
.section-title{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}

/* ---------- search ---------- */
.ucard{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.ucard:hover{border-color:var(--line-2)}.ucard .nm{font-weight:700}.ucard .st{font-size:12.5px;color:var(--dim)}

/* ---------- ai roast ---------- */
.terminal{padding:0;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.term-bar i{width:10px;height:10px;border-radius:50%;background:var(--surface-3)}
.term-bar i:first-child{background:#ff5f56}.term-bar i:nth-child(2){background:#ffbd2e}.term-bar i:nth-child(3){background:#27c93f}
.term-bar span{font:700 12px var(--mono);color:var(--muted);margin-left:8px;letter-spacing:.06em}
.term-body{padding:18px}
.seg{display:inline-flex;padding:4px;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:11px;margin-bottom:14px}
.seg label{padding:6px 14px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;transition:all .15s}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:var(--grad);color:#fff}
.seg label:has(input:focus-visible){outline:2px solid var(--accent-2)}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
.roast-out{margin-top:18px;padding:18px;border-radius:12px;border:1px solid rgba(255,77,46,.4);background:linear-gradient(180deg,rgba(255,77,46,.08),rgba(255,77,46,.02));animation:rise .3s both}
.roast-out.safe{border-color:rgba(122,168,255,.45);background:rgba(122,168,255,.06)}
.roast-text{font-size:19px;font-weight:700;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere;min-height:28px}
.caret::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
.meter{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:14px 0 6px}
.meter i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.roast-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:600 12px var(--mono);color:var(--dim)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font:600 13px var(--mono)}
.dots i{display:inline-block;width:5px;height:5px;margin-right:3px;border-radius:50%;background:var(--accent);animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

/* ---------- right rail ---------- */
.side-card{padding:16px}
.side-card .eyebrow{display:block;margin-bottom:10px}
.side-prompt{font-weight:800;font-size:16px;margin-bottom:12px}
.mini-row{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.mini-row .pos{font:800 12px var(--mono);color:var(--dim);width:22px}
.mini-row .nm{flex:1;font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row .pts{font:700 12px var(--mono);color:var(--accent-2)}
.mini-bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--surface-3);margin:8px 0 6px}
.mini-bar i{display:block;background:var(--grad)}.mini-bar i+i{background:var(--info)}
.side-link{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--accent-2)}

/* ---------- states ---------- */
.state{padding:38px 22px;text-align:center}
.state .emoji{font-size:34px;margin-bottom:8px}
.state h3{font-size:18px;font-weight:800;margin-bottom:4px}
.state p{color:var(--muted);max-width:380px;margin:0 auto 14px}
.skel{height:132px;border-radius:var(--r);margin-bottom:12px;border:1px solid var(--line);background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);background-size:300% 100%;animation:shimmer 1.4s infinite linear}
.offline{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;gap:12px;align-items:center;justify-content:center;padding:10px 14px;background:#2a1215;border-bottom:1px solid rgba(255,93,108,.5);color:#ffc9ce;font-size:13.5px;font-weight:600;text-align:center;flex-wrap:wrap}
.offline[hidden]{display:none}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(5,5,7,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .15s both}
.modal{width:min(580px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 40px 90px -30px #000;animation:pop-in .22s cubic-bezier(.2,.9,.3,1.1) both}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:17px;font-weight:800}
.modal-body{padding:18px;overflow:auto;overscroll-behavior:contain}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.note{font-size:12.5px;color:var(--dim);margin:-6px 0 14px}
.radio-list{display:grid;gap:8px;margin-bottom:14px}
.radio-list label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer;text-transform:capitalize;font-weight:600}
.radio-list label:has(input:checked){border-color:var(--accent);background:rgba(255,77,46,.08)}
.radio-list input{accent-color:var(--accent)}
.thread-post h3{font-size:21px;font-weight:900;margin:10px 0 8px;overflow-wrap:anywhere}
.thread-post .full{white-space:pre-line;color:#d9d9df;overflow-wrap:anywhere}
.cmt{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);animation:rise .25s both}
.cmt .b{flex:1;min-width:0}
.cmt .h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim)}
.cmt .h button.u{color:var(--text);font-weight:700}
.cmt .h .rp{margin-left:auto;opacity:.5;padding:2px 4px}.cmt .h .rp:hover{opacity:1;color:var(--bad)}
.cmt p{white-space:pre-line;overflow-wrap:anywhere;margin-top:2px}
.cmt-form{position:sticky;bottom:-18px;background:var(--surface);margin:14px -18px -18px;padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-end}
.cmt-form textarea{min-height:44px;height:44px;resize:none}
@media (max-width:600px){.overlay{place-items:end center;padding:0}.modal{width:100%;max-height:92dvh;border-radius:18px 18px 0 0;animation:sheet .26s cubic-bezier(.2,.9,.3,1) both}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:grid;gap:8px;width:min(360px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(24,24,28,.96);border:1px solid var(--line-2);box-shadow:0 18px 40px -16px #000;font-weight:600;font-size:14px;
  opacity:0;transform:translateY(10px) scale(.98);transition:opacity .22s,transform .22s}
.toast.in{opacity:1;transform:none}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 12px var(--good)}
.toast.err::before{background:var(--bad);box-shadow:0 0 12px var(--bad)}.toast.info::before{background:var(--info);box-shadow:0 0 12px var(--info)}
@media (max-width:860px){#toasts{right:50%;transform:translateX(50%);bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom))}}
body.noscroll{overflow:hidden}

/* ---------- motion ---------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes pop-in{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
@keyframes shimmer{to{background-position:-300% 0}}
@keyframes blink{50%{opacity:0}}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
(() => {
'use strict';

/* =====================================================================
   CONFIG + UTILITIES
   ===================================================================== */
const TAGS = ['College','Dating','Confession','Opinion','Random','Tech','Life','Relationships','Other'];
const TAG_EMOJI = {College:'🎓',Dating:'💔',Confession:'🤫',Opinion:'🔥',Random:'🎲',Tech:'💻',Life:'🌀',Relationships:'💬',Other:'✨'};
const REASONS = ['harassment','spam','hate','sexual content','self-harm','violence','other'];
const SORTS = [['new','New'],['top','Top'],['discussed','Most roasted']];
const NAV = [
  ['home','Home','home'],['trending','Trending','trend'],['battles','Battles','zap'],
  ['challenge','Daily','cal'],['leaderboard','Ranks','award'],['roast','AI Roast','cpu'],
];

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// html`` auto-escapes every interpolation unless it is already Raw. This is the XSS guard for all rendering.
class Raw { constructor(s) { this.s = s; } }
const raw = s => new Raw(s);
const fmt = v => v == null || v === false ? '' : v instanceof Raw ? v.s : Array.isArray(v) ? v.map(fmt).join('') : esc(v);
const html = (strs, ...vals) => new Raw(strs.reduce((a, s, i) => a + s + (i < vals.length ? fmt(vals[i]) : ''), ''));
const mount = (el, r) => { if (el) el.innerHTML = r instanceof Raw ? r.s : esc(r); };
const icon = (n, cls = '') => raw(`<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const rand = (n, alphabet = 'abcdefghijklmnopqrstuvwxyz0123456789') => {
  const bytes = new Uint8Array(n);
  (window.crypto || window.msCrypto) ? crypto.getRandomValues(bytes) : bytes.forEach((_, i) => bytes[i] = Math.random() * 256);
  return [...bytes].map(b => alphabet[b % alphabet.length]).join('');
};
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const initial = n => (String(n).replace(/^anonymous_/, '').match(/[A-Za-z0-9]/) || ['?'])[0].toUpperCase();
const avatar = (n, size = '') => raw(`<span class="avatar ${size}" style="--h:${hue(n)}" aria-hidden="true">${esc(initial(n))}</span>`);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function timeAgo(iso) {
  const d = new Date(iso), s = Math.max(0, (Date.now() - d.getTime()) / 1000);
  if (s < 45) return 'just now';
  const m = s / 60; if (m < 60) return `${Math.floor(m)}m ago`;
  const h = m / 60; if (h < 24) return `${Math.floor(h)}h ago`;
  const dd = h / 24; if (dd < 7) return `${Math.floor(dd)}d ago`;
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
}
const joined = iso => new Date(iso).toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  ta.remove(); return ok;
}

/* =====================================================================
   API  (same-origin first, then http://127.0.0.1:5000 for Live Server / file://)
   ===================================================================== */
class ApiError extends Error {
  constructor(message, status = 0, offline = false, data = null) { super(message); this.status = status; this.offline = offline; this.data = data; this.code = data && data.code; }
}
const API = {
  base: '',
  async detect() {
    const custom = window.ROASTROOM_API_BASE || store.get('rr.api');
    const list = custom ? [custom.replace(/\/$/, '')]
      : location.protocol === 'file:' ? ['http://127.0.0.1:5000', 'http://localhost:5000'] : ['', 'http://127.0.0.1:5000'];
    for (const base of list) {
      const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 2500);
      try {
        const r = await fetch(base + '/api/health', { signal: ctrl.signal });
        const j = await r.json();
        if (j && j.service === 'roastroom') { this.base = base; UI.setOffline(false); return true; }
      } catch {} finally { clearTimeout(t); }
    }
    this.base = list[0]; UI.setOffline(true); return false;
  },
  async request(method, path, body) {
    const headers = { Accept: 'application/json' };
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (Identity.token) { headers['X-Username'] = Identity.username; headers['X-Token'] = Identity.token; }
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 12000);
    let res;
    try {
      res = await fetch(this.base + path, { method, headers, signal: ctrl.signal, body: body !== undefined ? JSON.stringify(body) : undefined });
    } catch (e) {
      UI.setOffline(true);
      throw new ApiError(e.name === 'AbortError' ? 'The server took too long to answer.' : "Can't reach the ROASTROOM server.", 0, true);
    } finally { clearTimeout(t); }
    UI.setOffline(false);
    let data = null; try { data = await res.json(); } catch {}
    if (!res.ok) throw new ApiError((data && data.error) || `Something went wrong (${res.status}).`, res.status, false, data);
    return data;
  },
  get: p => API.request('GET', p),
  post: (p, b = {}) => API.request('POST', p, b),
};

/* =====================================================================
   STATE
   ===================================================================== */
const State = { navId: 0, route: 'home', posts: new Map(), battles: new Map(), roastPrefill: null };
const remember = list => list.forEach(p => State.posts.set(p.id, p));

/* =====================================================================
   IDENTITY  (pseudonymous, stored in this browser only)
   ===================================================================== */
const Identity = {
  username: '', token: '',
  load() {
    this.username = store.get('rr.username') || '';
    this.token = store.get('rr.token') || '';
    if (!/^[A-Za-z0-9_]{3,24}$/.test(this.username) || this.token.length < 16) this.reset(false);
  },
  reset(save = true) {
    this.username = 'anonymous_' + rand(6);
    this.token = rand(40);
    store.set('rr.username', this.username); store.set('rr.token', this.token);
    if (save) UI.renderIdentity();
  },
  async register() {
    try { await API.post('/api/identity'); }
    catch (e) {
      if (e.code === 'identity_conflict') { this.reset(); await API.post('/api/identity'); } else throw e;
    }
  },
  async rename(name) {
    const r = await API.post('/api/users/me/rename', { username: name });
    this.username = r.user.username; store.set('rr.username', this.username); UI.renderIdentity();
  },
  isMe: n => String(n).toLowerCase() === Identity.username.toLowerCase(),
};

/* =====================================================================
   UI HELPERS  (toasts, modals, states, nav)
   ===================================================================== */
const UI = {
  toast(msg, kind = 'ok', ms = 3200) {
    const box = $('#toasts');
    while (box.children.length >= 3) box.firstChild.remove();
    const el = document.createElement('div');
    el.className = 'toast ' + kind; el.setAttribute('role', kind === 'err' ? 'alert' : 'status'); el.textContent = msg;
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 260); }, ms);
  },
  error(e, fallback = 'Something went wrong.') {
    if (e && e.status === 429) return this.toast(e.message, 'info', 4200);
    if (e && e.status === 409) return this.toast(e.message, 'info');
    this.toast((e && e.message) || fallback, 'err', 4200);
  },
  setOffline(flag) { $('#offline').hidden = !flag; },
  skeletons: n => raw('<div aria-hidden="true">' + '<div class="skel"></div>'.repeat(n) + '</div>'),
  empty({ emoji = '🫥', title, text = '', action = '', label = '' }) {
    return html`<div class="card state"><div class="emoji">${emoji}</div><h3>${title}</h3><p>${text}</p>${action ? html`<button class="btn" data-action="${action}">${label}</button>` : ''}</div>`;
  },
  errorState(e, action = 'retry') {
    const off = e && e.offline;
    return this.empty({ emoji: off ? '🔌' : '💥', title: off ? 'Server unreachable' : 'That broke',
      text: off ? "Start the backend with python backend/app.py, then retry." : ((e && e.message) || 'Something went wrong.'), action, label: 'Try again' });
  },
  renderIdentity() {
    const n = Identity.username;
    mount($('#me-chip'), html`${avatar(n, 'md')}<div><div class="nm">${n}</div><div class="sub">Anonymous · tap to edit</div></div>${icon('edit')}`);
    mount($('#top-avatar'), avatar(n, 'md'));
    Nav.render();
  },
};

const Modal = {
  stack: [],
  open({ title, body, label }) {
    const prev = document.activeElement;
    const wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.innerHTML = `<div class="modal card" role="dialog" aria-modal="true" aria-label="${esc(label || title)}">
      <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
      <div class="modal-body"></div></div>`;
    mount($('.modal-body', wrap), body);
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) this.close(); });
    $('#modal-root').appendChild(wrap);
    document.body.classList.add('noscroll');
    this.stack.push({ wrap, prev });
    const first = $('input:not([type=radio]),textarea', wrap) || $('[data-action="close-modal"]', wrap);
    setTimeout(() => first && first.focus({ preventScroll: true }), 30);
    return wrap;
  },
  top: () => Modal.stack[Modal.stack.length - 1]?.wrap,
  setBody(body) { const w = this.top(); if (w) mount($('.modal-body', w), body); },
  close() {
    const m = this.stack.pop(); if (!m) return;
    m.wrap.remove();
    if (!this.stack.length) document.body.classList.remove('noscroll');
    try { m.prev && m.prev.focus && m.prev.focus({ preventScroll: true }); } catch {}
  },
  closeAll() { while (this.stack.length) this.close(); },
};

/* =====================================================================
   SEARCH  (debounced)
   ===================================================================== */
const Search = {
  seq: 0,
  input: debounce(q => Search.go(q), 320),
  go(q) {
    q = q.trim();
    if (q.length < 2) { if (State.route === 'search') { history.replaceState(null, '', '#/search'); this.render($('#view'), '', () => State.route === 'search'); } return; }
    const target = '#/search?q=' + encodeURIComponent(q);
    if (State.route === 'search') { history.replaceState(null, '', target); this.render($('#view'), q, () => State.route === 'search'); }
    else location.hash = target;
  },
  async render(view, q, alive) {
    const seq = ++this.seq;
    if (q.length < 2) return mount(view, html`<div class="page-head"><div><h1>Search</h1><p>Type at least 2 characters.</p></div></div>${UI.empty({ emoji: '🔎', title: 'Search the chaos', text: 'Find posts by title, story, tag, or username.' })}`);
    mount(view, html`<div class="page-head"><div><h1>Results for “${q}”</h1></div></div>${UI.skeletons(2)}`);
    try {
      const r = await API.get('/api/search?q=' + encodeURIComponent(q));
      if (seq !== this.seq || !alive()) return;
      remember(r.posts);
      mount(view, html`<div class="page-head"><div><h1>Results for “${r.q}”</h1><p>${plural(r.posts.length, 'post')} · ${plural(r.users.length, 'user')}</p></div></div>
        ${!r.posts.length && !r.users.length ? UI.empty({ emoji: '🕳️', title: 'Nothing matched', text: "The internet hasn't ruined that yet. Try another word, or post it yourself.", action: 'open-create', label: 'Post' }) : html`
        ${r.users.length ? html`<div class="section-title" style="margin-top:0">Users</div>${r.users.map(u => html`<div class="ucard card" data-action="profile" data-user="${u.username}" role="link" tabindex="0">${avatar(u.username, 'md')}<div><div class="nm">${u.username}</div><div class="st">${statLine(u)}</div></div></div>`)}` : ''}
        ${r.posts.length ? html`<div class="section-title">Posts</div>${postList(r.posts)}` : ''}`}`);
    } catch (e) { if (seq === this.seq && alive()) mount(view, UI.errorState(e, 'retry')); }
  },
};

const EXAMPLES = ['I studied for 5 hours and still failed.', 'She left me on seen for 3 days.', 'I pushed to main on a Friday.', 'I waved back at someone who was not waving at me.'];
const Roast = {
  typing: null,
  render(view) {
    const pre = State.roastPrefill; State.roastPrefill = null;
    mount(view, html`<div class="page-head"><div><h1>🤖 AI Roast</h1><p>Paste your problem. Get verbally disassembled. Free, local, zero API credits.</p></div></div>
    <section class="card terminal"><div class="term-bar"><i></i><i></i><i></i><span>ROAST.AI · local engine</span></div>
    <form class="term-body" data-form="roast" novalidate>
      <div class="field"><label for="r-text">Your story <span class="counter" data-counter="r-text" data-max="500">0/500</span></label>
        <textarea id="r-text" name="text" class="textarea" maxlength="500" placeholder="I studied for 5 hours and still failed…"></textarea></div>
      <div class="examples">${EXAMPLES.map(t => html`<button type="button" class="chip" data-action="example" data-text="${t}">${t}</button>`)}</div>
      <div class="seg" role="radiogroup" aria-label="Intensity">${['mild', 'medium', 'spicy'].map(l => html`<label><input type="radio" name="intensity" value="${l}" ${l === 'medium' ? 'checked' : ''}>${l === 'mild' ? '🙂' : l === 'medium' ? '😏' : '🌶️'} ${l[0].toUpperCase() + l.slice(1)}</label>`)}</div>
      <button class="btn block" type="submit">${icon('cpu')}Roast me</button>
      <div id="roast-out" aria-live="polite"></div>
      <p class="fine" style="margin-top:14px">Roasts target situations and decisions, never identities. Entertainment only.</p>
    </form></section>`);
    const ta = $('#r-text');
    if (pre) { ta.value = pre.text; updateCounter(ta); this.run(pre.text, 'medium'); }
  },
  async run(text, intensity) {
    const out = $('#roast-out'); if (!out) return;
    clearInterval(this.typing);
    mount(out, html`<div class="roast-out"><div class="thinking"><span class="dots"><i></i><i></i><i></i></span>Analyzing your life choices…</div></div>`);
    const btn = $('[data-form=roast] button[type=submit]'); btn && btn.classList.add('loading');
    try {
      const [r] = await Promise.all([API.post('/api/ai-roast', { text, intensity }), new Promise(res => setTimeout(res, 650))]);
      if (!$('#roast-out')) return;
      if (r.blocked) { mount(out, html`<div class="roast-out safe"><div class="eyebrow" style="color:var(--info)">${r.kind === 'support' ? 'Hey, real talk' : 'Not roastable'}</div><p class="roast-text" style="font-size:16px;margin-top:8px">${r.message}</p></div>`); return; }
      mount(out, html`<div class="roast-out"><div class="eyebrow">Verdict · ${r.verdict}</div>
        <p class="roast-text caret" id="roast-text" style="margin-top:10px"></p>
        <div class="meter" aria-label="Damage ${r.damage} out of 100"><i id="meter"></i></div>
        <div class="roast-meta"><span>DAMAGE ${r.damage}/100</span><span>${r.intensity.toUpperCase()} · ${r.provider}</span></div>
        <div class="modal-actions" style="justify-content:flex-start;margin-top:14px"><button type="button" class="btn sm ghost" data-action="copy-roast" data-text="${r.roast}">Copy</button><button type="button" class="btn sm ghost" data-action="share-roast" data-text="${r.roast}">${icon('share')}Share</button><button type="button" class="btn sm" data-action="post-roast" data-text="${text}">Post this story</button></div></div>`);
      const el = $('#roast-text'); let i = 0;
      requestAnimationFrame(() => { const m = $('#meter'); if (m) m.style.width = r.damage + '%'; });
      if (reduceMotion()) { el.textContent = r.roast; el.classList.remove('caret'); }
      else this.typing = setInterval(() => { el.textContent = r.roast.slice(0, ++i); if (i >= r.roast.length) { clearInterval(this.typing); el.classList.remove('caret'); } }, 18);
      UI.toast('Roast landed 💀');
    } catch (e) { mount(out, ''); UI.error(e); } finally { btn && btn.classList.remove('loading'); }
  },
};

/* =====================================================================
   ROUTER
   ===================================================================== */
const Views = {
  home: renderHome,
  trending: renderTrending,
  battles: renderBattles,
  challenge: (v, c) => Challenge.render(v, c),
  leaderboard: renderLeaderboard,
  roast: v => Roast.render(v),
  search: (v, c) => Search.render(v, (c.params.get('q') || '').trim(), c.alive),
  u: renderProfile,
};
const TITLES = { trending: 'Trending', battles: 'Roast Battles', challenge: 'Daily Challenge', leaderboard: 'Leaderboard', roast: 'AI Roast', search: 'Search' };

const Router = {
  leave: [],
  onLeave(fn) { this.leave.push(fn); },
  parse() {
    const [path, query = ''] = location.hash.replace(/^#\/?/, '').split('?');
    const parts = path.split('/').filter(Boolean);
    let arg = null; try { arg = parts[1] ? decodeURIComponent(parts[1]) : null; } catch {}
    return { name: parts[0] || 'home', arg, params: new URLSearchParams(query) };
  },
  start() { addEventListener('hashchange', () => this.go()); this.go(); },
  async go() {
    this.leave.splice(0).forEach(fn => { try { fn(); } catch {} });
    const { name, arg, params } = this.parse();
    const id = ++State.navId, alive = () => id === State.navId;
    Modal.closeAll();
    State.route = Views[name] ? name : 'home';
    Nav.mark(State.route === 'u' && Identity.isMe(arg || '') ? 'u' : State.route === 'u' ? 'none' : State.route);
    const view = $('#view'); window.scrollTo(0, 0);
    document.title = (TITLES[State.route] ? TITLES[State.route] + ' · ' : '') + 'ROASTROOM';
    if (State.route === 'search') { const s = $('#search'); if (s && document.activeElement !== s) s.value = params.get('q') || ''; }
    try { await Views[State.route](view, { arg, params, alive }); }
    catch (e) { if (alive()) mount(view, UI.errorState(e)); }
  },
};

/* =====================================================================
   EVENTS  (single delegated listeners)
   ===================================================================== */
function updateCounter(el) {
  if (!el) return;
  const c = $(`[data-counter="${el.id}"]`); if (!c) return;
  const max = Number(c.dataset.max), n = el.value.length;
  c.textContent = `${n}/${max}`; c.classList.toggle('warn', n > max * .85); c.classList.toggle('over', n >= max);
}

const Actions = {
  'open-create': () => Posts.openCreate(),
  'close-modal': () => Modal.close(),
  'open-settings': () => Settings.open(),
  'my-profile': () => { Modal.closeAll(); location.hash = '#/u/' + Identity.username; },
  'reset-identity': el => Settings.reset(el),
  'go-home': () => { location.hash = '#/home'; },
  retry: async () => { await API.detect(); try { await Identity.register(); } catch {} Router.go(); Side.render(); },
  'feed-retry': () => Feed.load(true),
  refresh: () => { Feed.load(true); UI.toast('Feed refreshed', 'info', 1600); },
  'trend-refresh': () => Router.go(),
  'load-more': el => { el.classList.add('loading'); Feed.load(false); },
  sort: el => { Feed.sort = el.dataset.sort; $$('.tabs button').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); }); Feed.load(true); },
  tag: el => { Feed.tag = el.dataset.tag; $$('.chips [data-action=tag]').forEach(b => b.classList.toggle('on', b === el)); Feed.load(true); },
  like: el => Likes.toggle(Number(el.dataset.id), el),
  comments: el => Comments.open(Number(el.dataset.id)),
  share: el => Share.post(Number(el.dataset.id)),
  report: el => Moderation.open(el.dataset.type, el.dataset.key),
  profile: el => { Modal.closeAll(); location.hash = '#/u/' + encodeURIComponent(el.dataset.user); },
  'roast-post': el => { const p = State.posts.get(Number(el.dataset.id)); if (!p) return; State.roastPrefill = { text: `${p.title}. ${p.body}`.slice(0, 500) }; Modal.closeAll(); if (State.route === 'roast') Router.go(); else location.hash = '#/roast'; },
  vote: el => Battles.vote(Number(el.dataset.id), el.dataset.choice),
  'new-battle': () => Battles.openCreate(),
  example: el => { const ta = $('#r-text'); ta.value = el.dataset.text; updateCounter(ta); ta.focus(); },
  'copy-roast': async el => UI.toast((await copyText(el.dataset.text)) ? 'Copied 📋' : 'Copy failed', 'info'),
  'share-roast': async el => { const t = el.dataset.text + '\n(via ROASTROOM)'; if (navigator.share) { try { await navigator.share({ text: t }); return; } catch (e) { if (e.name === 'AbortError') return; } } UI.toast((await copyText(t)) ? 'Copied 📋' : 'Copy failed', 'info'); },
  'post-roast': el => Posts.openCreate({ title: '', body: el.dataset.text, tag: 'Random' }),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = Actions[el.dataset.action]; if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault(); e.stopPropagation(); fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && Modal.stack.length) return Modal.close();
  const tgt = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && tgt.matches && tgt.matches('[role=link][data-action],[role=button][data-action]')) { e.preventDefault(); Actions[tgt.dataset.action]?.(tgt, e); }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(tgt.tagName) && !Modal.stack.length) { e.preventDefault(); $('#search').focus(); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && tgt.tagName === 'TEXTAREA') tgt.form?.requestSubmit();
  if (e.key === 'Enter' && !e.shiftKey && tgt.matches && tgt.matches('.cmt-form textarea')) { e.preventDefault(); tgt.form.requestSubmit(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id) updateCounter(t);
  if (t.id === 'search') Search.input(t.value);
  if (t.id === 'ch-answer') {
    const max = Number(t.dataset.maxWords), n = wordCount(t.value), c = $('#ch-count');
    c.textContent = `${n}/${max} words`; c.classList.toggle('over', n > max); c.classList.toggle('warn', n === max);
  }
});
document.addEventListener('submit', e => {
  const form = e.target; if (!form.dataset.form) return;
  e.preventDefault();
  const handlers = {
    'create-post': () => Posts.submit(form), comment: () => Comments.submit(form), battle: () => Battles.submit(form),
    challenge: () => Challenge.submit(form), report: () => Moderation.submit(form), rename: () => Settings.rename(form),
    roast: () => { const f = new FormData(form), text = (f.get('text') || '').trim(); if (text.length < 5) return UI.toast('Give us a bit more to work with (5+ characters).', 'err'); Roast.run(text, f.get('intensity') || 'medium'); },
  };
  handlers[form.dataset.form]?.();
});
$('#search').addEventListener('keydown', e => { if (e.key === 'Enter') Search.go(e.target.value); if (e.key === 'Escape') { e.target.value = ''; e.target.blur(); } });

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot() {
  Identity.load();
  UI.renderIdentity();
  await API.detect();
  try { await Identity.register(); } catch (e) { /* offline banner is already visible; server also registers lazily */ }
  UI.renderIdentity();
  Router.start();
  Side.render();
  const postId = Number(new URLSearchParams(location.search).get('post'));
  if (postId > 0) Comments.open(postId);
})();
})();
</script>
</body>
</html>
